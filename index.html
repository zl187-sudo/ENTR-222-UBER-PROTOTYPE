<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uber Clone – 3D Houston Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Helvetica, Arial, sans-serif; }
    header { background: #000; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    header strong { font-size: 24px; letter-spacing: -1px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; background: #fff; color: #000; }
    #map { position: absolute; top: 56px; bottom: 0; left: 0; right: 0; }
    #controls { position: absolute; top: 68px; left: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
    #controls button { background: #000; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    #info { position: absolute; bottom: 24px; left: 12px; right: 12px; max-width: 360px; background: #fff; padding: 12px 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 5; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <strong>Uber</strong>
    <button onclick="window.location.href='index.html'">← Back</button>
  </header>

  <div id="controls">
    <button id="rotateBtn">Rotate view</button>
    <button id="tripBtn">Fly to Downtown</button>
  </div>
  <div id="info">3D building mass of Houston. Drag to pan, right-click drag (or two fingers) to tilt and rotate.</div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // Mock coordinates [longitude, latitude]
    const RICE = [-95.4018, 29.7174];
    const DOWNTOWN = [-95.3698, 29.7604];

    // Free OpenStreetMap-based vector tiles (OpenFreeMap): no API key, no login
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: RICE,
      zoom: 15.5,
      pitch: 60,
      bearing: -20,
      maxPitch: 80
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");

    map.on("load", function () {
      // Find the vector source that holds the building footprints
      const style = map.getStyle();
      const sourceName = Object.keys(style.sources).find(function (k) {
        return style.sources[k].type === "vector";
      });

      // Hide the style's own flat/3D building layers so ours is the only one
      style.layers.forEach(function (l) {
        if (l["source-layer"] === "building") { map.setLayoutProperty(l.id, "visibility", "none"); }
      });

      // 3D building mass, colored by height (taller = darker)
      map.addLayer({
        id: "houston-3d-buildings",
        type: "fill-extrusion",
        source: sourceName,
        "source-layer": "building",
        minzoom: 13,
        paint: {
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], 12],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-opacity": 0.9,
          "fill-extrusion-color": [
            "interpolate", ["linear"], ["coalesce", ["get", "render_height"], 12],
            0, "#d9d9d9", 30, "#a8a8a8", 100, "#5c5c5c", 250, "#111111"
          ]
        }
      });

      // Pickup and destination markers
      new maplibregl.Marker({ color: "#1a9e4b" }).setLngLat(RICE)
        .setPopup(new maplibregl.Popup().setText("Pickup: Rice University")).addTo(map);
      new maplibregl.Marker({ color: "#000000" }).setLngLat(DOWNTOWN)
        .setPopup(new maplibregl.Popup().setText("Dropoff: Downtown Houston")).addTo(map);
    });

    // Button 1: slowly rotate the camera
    let rotating = false;
    function spin() {
      if (!rotating) return;
      map.setBearing(map.getBearing() + 0.3);
      requestAnimationFrame(spin);
    }
    document.getElementById("rotateBtn").addEventListener("click", function () {
      rotating = !rotating;
      this.textContent = rotating ? "Stop rotating" : "Rotate view";
      spin();
    });

    // Button 2: fly between pickup and dropoff
    let atDowntown = false;
    document.getElementById("tripBtn").addEventListener("click", function () {
      atDowntown = !atDowntown;
      map.flyTo({ center: atDowntown ? DOWNTOWN : RICE, zoom: atDowntown ? 15.8 : 15.5, pitch: 65, duration: 4000 });
      this.textContent = atDowntown ? "Fly back to Rice" : "Fly to Downtown";
    });
  </script>
</body>
</html>
